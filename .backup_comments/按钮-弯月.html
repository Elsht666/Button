<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白天 / 黑夜 主题切换</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    background: #eef3f9;
    transition: background 0.7s ease, color 0.7s ease;
    color: #2c3e50;
  }
  body.night {
    background: #0a0f1f;
    color: #d7dee8;
  }

  h1 { font-size: 20px; letter-spacing: 2px; opacity: 0.8; font-weight: 500; }

  /* ========== 开关按钮 ========== */
  .toggle {
    position: relative;
    width: 200px;
    height: 90px;
    border-radius: 90px;
    cursor: pointer;
    border: none;
    outline: none;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #4a90d9 0%, #6fb0ee 55%, #9bcbf5 100%);
    transition: background 0.7s ease, box-shadow 0.7s ease;
    box-shadow: 0 10px 28px rgba(74, 144, 217, 0.32), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .toggle.night {
    background: linear-gradient(135deg, #070d1c 0%, #111a30 55%, #1c2a48 100%);
    box-shadow: 0 10px 28px rgba(7, 13, 28, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* ========== 太阳（右上） ========== */
  .sun {
    position: absolute;
    top: 14px;
    right: 26px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff5c0, #ffd84d 70%, #ffc107);
    box-shadow: 0 0 14px rgba(255, 216, 77, 0.85), 0 0 30px rgba(255, 193, 7, 0.55), 0 0 50px rgba(255, 179, 0, 0.3);
    animation: sunGlow 3s ease-in-out infinite;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  @keyframes sunGlow {
    0%, 100% { transform: scale(1);   box-shadow: 0 0 14px rgba(255,216,77,.85), 0 0 30px rgba(255,193,7,.55), 0 0 50px rgba(255,179,0,.3); }
    50%      { transform: scale(1.07); box-shadow: 0 0 20px rgba(255,216,77,1),   0 0 42px rgba(255,193,7,.7),  0 0 68px rgba(255,179,0,.4); }
  }
  .toggle.night .sun { opacity: 0; transform: scale(0.5); }

  /* ========== 云朵（滑块后方；cloud1 太阳正下方靠右、cloud2 按钮中间，均远离底部圆角） ========== */
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0,0,0,0.07);
    transition: opacity 0.55s ease, transform 0.55s ease;
    z-index: 1; /* 滑块 knob z=10，云在滑块之后 */
  }
  /* 定位策略：改用 right+top / left+top 组合，把两朵云整体抬高到按钮中上部，
     彻底避开胶囊底部圆角裁切区；同时 cloud1(右) 与 cloud2(左中) 上下左右错开不重叠。 */

  /* 云朵1：太阳正下方（太阳 right:26px / top:14px） */
  .cloud1 { right: 28px; top: 46px; width: 40px; height: 18px; }
  .cloud1::before { content:""; position:absolute; left:6px;  top:-8px;  width:17px; height:17px; background:#fff; border-radius:50%; }
  .cloud1::after  { content:""; position:absolute; left:19px; top:-10px; width:15px; height:15px; background:#fff; border-radius:50%; }

  /* 云朵2：按钮中间区域（水平居中偏左） */
  .cloud2 { left: 84px; top: 30px; width: 30px; height: 14px; }
  .cloud2::before { content:""; position:absolute; left:4px;  top:-6px;  width:12px; height:12px; background:#fff; border-radius:50%; }
  .cloud2::after  { content:""; position:absolute; left:13px; top:-8px; width:12px; height:12px; background:#fff; border-radius:50%; }

  .toggle.night .cloud { opacity: 0; transform: translateY(8px); }

  /* ========== 月亮 🌙（左上） ========== */
  .moon {
    position: absolute;
    top: 12px;
    left: 22px;
    font-size: 28px;
    line-height: 1;
    text-shadow: 0 0 12px rgba(255, 230, 150, 0.95), 0 0 26px rgba(255, 220, 120, 0.6);
    opacity: 0;
    transform: scale(0.5) rotate(-18deg);
    transition: opacity 0.55s ease, transform 0.55s ease;
    pointer-events: none;
    z-index: 2;
  }
  .toggle.night .moon { opacity: 1; transform: scale(1) rotate(0); }

  /* ========== 星星 ========== */
  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 2.2s ease-in-out infinite;
    transition: opacity 0.5s ease;
    z-index: 2;
  }
  .toggle.night .star { opacity: 1; }
  .star.s1 { top: 20px; left: 64px;  animation-delay: 0s; }
  .star.s2 { top: 38px; left: 104px; animation-delay: 0.4s; }
  .star.s3 { top: 16px; left: 134px; animation-delay: 0.8s; }
  .star.s4 { top: 46px; left: 52px;  animation-delay: 1.2s; }
  .star.s5 { top: 28px; left: 162px; animation-delay: 0.6s; }
  .star.s6 { top: 54px; left: 124px; animation-delay: 1.6s; }
  .star.s7 { top: 22px; left: 90px;  animation-delay: 1.0s; }
  .star.s8 { top: 50px; left: 158px; animation-delay: 0.3s; }

  @keyframes twinkle {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.7); opacity: 0.35; }
  }

  /* ========== 滑块（手柄） ========== */
  .knob {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: linear-gradient(160deg, #ffe7a0, #f0d080 60%, #e2bf6a);
    box-shadow: 0 5px 14px rgba(0,0,0,0.26), inset 0 -3px 6px rgba(0,0,0,0.09), inset 0 2px 4px rgba(255,255,255,0.5);
    transition: transform 0.55s cubic-bezier(0.68, -0.1, 0.265, 1.2), background 0.55s ease, box-shadow 0.55s ease;
    z-index: 10;
  }
  .toggle.night .knob {
    transform: translateX(110px);
    background: linear-gradient(160deg, #e4e4e4, #c8c8c8 60%, #b3b3b3);
    box-shadow: 0 5px 14px rgba(0,0,0,0.42), inset 0 -3px 6px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.4);
  }

  /* ========== 状态文字 ========== */
  .status { font-size: 13px; opacity: 0.65; letter-spacing: 3px; }
</style>
</head>
<body>
  <h1>白天 / 黑夜 主题切换</h1>

  <button class="toggle" id="toggle" aria-label="切换白天/黑夜模式">
    <!-- 太阳 -->
    <span class="sun"></span>

    <!-- 云朵（两朵，错开，位于滑块后方） -->
    <span class="cloud cloud1"></span>
    <span class="cloud cloud2"></span>

    <!-- 月亮 -->
    <span class="moon">🌙</span>

    <!-- 星星 -->
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
    <span class="star s6"></span>
    <span class="star s7"></span>
    <span class="star s8"></span>

    <!-- 滑块 -->
    <span class="knob"></span>
  </button>

  <div class="status" id="status">当前模式：白天</div>

<script>
  const toggle = document.getElementById('toggle');
  const status = document.getElementById('status');
  let isNight = false;

  toggle.addEventListener('click', () => {
    isNight = !isNight;
    toggle.classList.toggle('night', isNight);
    document.body.classList.toggle('night', isNight);
    status.textContent = isNight ? '当前模式：黑夜' : '当前模式：白天';
  });
</script>
</body>
</html>
