<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day/Night Toggle 预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 44px;
            min-height: 100vh;
            background: #87b9f0;
            transition: background 0.7s;
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        }
        body.night {
            background: #0b1428;
            color: #d7dee8;
        }
        h1 { font-size: 20px; letter-spacing: 2px; opacity: 0.8; font-weight: 500; }
        .status { font-size: 13px; opacity: 0.65; letter-spacing: 3px; }

        .toggle {
            --ts: 1;
            position: relative;
            width: calc(200px * var(--ts));
            height: calc(90px * var(--ts));
            border-radius: calc(90px * var(--ts));
            cursor: pointer;
            background: linear-gradient(135deg, #4a90d9, #6fb0ee, #9bcbf5);
            transition: background 0.7s, transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.5s ease, border-color 0.5s ease;
            overflow: visible;

            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 0 40px rgba(59, 130, 246, 0.15),
                0 8px 32px rgba(0, 0, 0, 0.06);
        }

        .toggle.night {
            background: linear-gradient(135deg, #070d1c, #111a30, #1c2a48);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow:
                0 0 50px rgba(96, 165, 250, 0.07),
                0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .toggle:hover {
            transform: scale(1.07);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow:
                0 0 60px rgba(59, 130, 246, 0.25),
                0 12px 40px rgba(0, 0, 0, 0.08);
            transition: background 0.7s, transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.4s ease, border-color 0.3s ease;
        }
        .toggle.night:hover {
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow:
                0 0 70px rgba(96, 165, 250, 0.12),
                0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .toggle:active {
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow:
                0 0 25px rgba(59, 130, 246, 0.10),
                0 4px 16px rgba(0, 0, 0, 0.04);
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
        }
        .toggle.night:active {
            border-color: rgba(255, 255, 255, 0.04);
            box-shadow:
                0 0 30px rgba(96, 165, 250, 0.05),
                0 4px 16px rgba(0, 0, 0, 0.18);
        }

        .sun {
            position: absolute;
            top: calc(14px * var(--ts));
            right: calc(22px * var(--ts));
            width: calc(28px * var(--ts));
            height: calc(28px * var(--ts));
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #ffd700 60%, #ffb300 100%);
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.6), 0 0 18px rgba(255, 180, 0, 0.4), 0 0 30px rgba(255, 160, 0, 0.2);
            animation: sunGlow 2.5s ease-in-out infinite alternate;
            transition: opacity 0.5s, transform 0.5s;
        }
        .toggle.night .sun {
            opacity: 0;
            transform: scale(0.3);
        }
        @keyframes sunGlow {
            from {
                box-shadow: 0 0 8px rgba(255, 200, 0, 0.6), 0 0 18px rgba(255, 180, 0, 0.4), 0 0 30px rgba(255, 160, 0, 0.2);
            }
            to {
                box-shadow: 0 0 12px rgba(255, 210, 0, 0.8), 0 0 25px rgba(255, 190, 0, 0.5), 0 0 40px rgba(255, 170, 0, 0.3);
            }
        }

        .cloud {
            position: absolute;
            z-index: 1;
            width: calc(28px * var(--ts));
            height: calc(14px * var(--ts));
            background: #fff;
            border-radius: calc(14px * var(--ts));
            opacity: 0.9;
            transition: opacity 0.5s, transform 0.5s;
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::before {
            width: calc(14px * var(--ts));
            height: calc(14px * var(--ts));
            top: calc(-8px * var(--ts));
            left: calc(5px * var(--ts));
        }
        .cloud::after {
            width: calc(18px * var(--ts));
            height: calc(18px * var(--ts));
            top: calc(-11px * var(--ts));
            left: calc(11px * var(--ts));
        }
        .cloud1 {
            right: calc(28px * var(--ts));
            top: calc(52px * var(--ts));
        }
        .cloud2 {
            left: calc(92px * var(--ts));
            top: calc(36px * var(--ts));
            width: calc(24px * var(--ts));
            height: calc(12px * var(--ts));
        }
        .cloud2::before {
            width: calc(12px * var(--ts));
            height: calc(12px * var(--ts));
            top: calc(-6px * var(--ts));
            left: calc(4px * var(--ts));
        }
        .cloud2::after {
            width: calc(15px * var(--ts));
            height: calc(15px * var(--ts));
            top: calc(-9px * var(--ts));
            left: calc(10px * var(--ts));
        }
        .toggle.night .cloud {
            opacity: 0;
            transform: translateY(calc(8px * var(--ts)));
        }

        .star {
            position: absolute;
            width: calc(3px * var(--ts));
            height: calc(3px * var(--ts));
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 2s ease-in-out infinite;
        }
        .toggle.night .star {
            opacity: 1;
        }
        .star:nth-child(5) {
            top: calc(18px * var(--ts));
            left: calc(30px * var(--ts));
            animation-delay: 0s;
        }
        .star:nth-child(6) {
            top: calc(32px * var(--ts));
            left: calc(55px * var(--ts));
            animation-delay: .3s;
        }
        .star:nth-child(7) {
            top: calc(14px * var(--ts));
            left: calc(80px * var(--ts));
            animation-delay: .6s;
        }
        .star:nth-child(8) {
            top: calc(40px * var(--ts));
            left: calc(100px * var(--ts));
            animation-delay: .9s;
        }
        .star:nth-child(9) {
            top: calc(22px * var(--ts));
            left: calc(125px * var(--ts));
            animation-delay: 1.2s;
        }
        .star:nth-child(10) {
            top: calc(50px * var(--ts));
            left: calc(140px * var(--ts));
            animation-delay: 1.5s;
        }
        .star:nth-child(11) {
            top: calc(16px * var(--ts));
            left: calc(160px * var(--ts));
            animation-delay: 1.8s;
        }
        .star:nth-child(12) {
            top: calc(38px * var(--ts));
            left: calc(70px * var(--ts));
            animation-delay: 2.1s;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: .2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .moon {
            position: absolute;
            top: calc(12px * var(--ts));
            left: calc(22px * var(--ts));
            width: calc(30px * var(--ts));
            height: calc(30px * var(--ts));
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fff 0%, #fff6d9 50%, #f2e3a8 100%);
            box-shadow: 0 0 6px rgba(255, 250, 200, 0.5), inset -3px -3px 8px rgba(200, 180, 80, 0.2);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s, transform 0.5s;
        }
        .toggle.night .moon {
            opacity: 1;
            transform: scale(1);
        }
        .moon::before {
            content: '';
            position: absolute;
            width: calc(30px * var(--ts));
            height: calc(30px * var(--ts));
            border-radius: 50%;
            background: #111a30;
            top: 0;
            left: 0;
            transform: translateX(0);
            animation: moonPhase 6s ease-in-out infinite alternate;
        }
        @keyframes moonPhase {
            0% {
                transform: translateX(calc(-18px * var(--ts)));
            }
            50% {
                transform: translateX(0px);
            }
            100% {
                transform: translateX(calc(18px * var(--ts)));
            }
        }

        .knob {
            position: absolute;
            z-index: 10;
            top: calc(8px * var(--ts));
            left: calc(8px * var(--ts));
            width: calc(74px * var(--ts));
            height: calc(74px * var(--ts));
            border-radius: 50%;
            background: linear-gradient(135deg, #f0d080, #e8b84a);
            box-shadow: inset 0 -2px 6px rgba(0, 0, 0, 0.15), inset 0 2px 6px rgba(255, 255, 255, 0.3);
            transition: transform 0.9s cubic-bezier(0.68, -0.1, 0.265, 1.2), background 0.9s;
        }
        .toggle.night .knob {
            transform: translateX(calc(110px * var(--ts)));
            background: linear-gradient(135deg, #d8d8d8, #a8a8a8);
        }
    </style>
</head>
<body>
    <h1>白天 / 黑夜 主题切换</h1>
    <div class="toggle" id="toggle" title="切换浅色/深色模式">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <span class="moon"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span><span class="star"></span>
        <span class="star"></span><span class="star"></span>
        <div class="knob"></div>
    </div>
    <div class="status" id="status">当前模式：白天</div>
    <script>
        const toggle = document.getElementById('toggle');
        const status = document.getElementById('status');
        let isNight = false;
        toggle.addEventListener('click', () => {
            isNight = !isNight;
            toggle.classList.toggle('night', isNight);
            document.body.classList.toggle('night', isNight);
            status.textContent = isNight ? '当前模式：黑夜' : '当前模式：白天';
        });
    </script>
</body>
</html>
